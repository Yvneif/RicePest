[tool.ruff]
line-length = 100
target-version = "py310"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = [
    "S101",  # assert usage is expected in tests
    "S310",  # send_from_directory paths are validated by Werkzeug
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
# Tagalog guidance strings are content, not code - allow long lines.
"app/api/recommend.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:keras.*",
    "ignore::DeprecationWarning:tensorflow.*",
]

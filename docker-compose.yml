# Production-style stack for local testing: docker compose up --build
# Requires SECRET_KEY and ADMIN_PASSWORD in ricepest-app/.env
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      FLASK_ENV: production
      COOKIE_SECURE: "false" # set "true" behind HTTPS
    volumes:
      - app-data:/app/data
      - ./models:/app/models:ro
    restart: unless-stopped

volumes:
  app-data:
